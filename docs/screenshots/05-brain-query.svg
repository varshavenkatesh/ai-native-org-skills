    <tspan x="20" fill="#808080">&gt; </tspan><tspan fill="#d4d4d4">/RESOLVER what did we decide about idempotency keys?</tspan>
  </text>

  <text x="20" y="526" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#858585">  Reading docs/decisions/decisions.md...</text>

  <text y="570" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13">
    <tspan x="20" fill="#dcdcaa">  2026-05-02</tspan><tspan fill="#858585"> — Standardize idempotency keys on UUID v7</tspan>
  </text>
  <text x="20" y="592" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#4a4a4a">  ─────────────────────────────────────</text>
  <text x="20" y="614" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#d4d4d4">  Use UUID v7 (not v4) for idempotency keys across all payment</text>
  <text x="20" y="636" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#d4d4d4">  service calls. UUID v7 is time-ordered, simplifies retry</text>
  <text x="20" y="658" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#d4d4d4">  deduplication, and aligns with Stripe v4 expectations.</text>
  <text x="20" y="680" font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#858585">  Agreed by: Arjun, Rohan, Dev</text>

