    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.6; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid #21262d; padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 12px; }

    .container { max-width: 860px; margin: 0 auto; padding: 40px 24px; }

    .customer-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .customer-card .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .customer-card h3 { font-size: 15px; font-weight: 600; color: #e6edf3; }
    .customer-card .since { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .risk-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .risk-high { background: #3d1515; color: #f85149; }
    .risk-medium { background: #2d2001; color: #d29922; }
    .risk-low { background: #0d2a0d; color: #3fb950; }
    .feedback-item { padding: 10px 0; border-bottom: 1px solid #21262d; }
    .feedback-item:last-child { border-bottom: none; }
    .feedback-item .date { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .feedback-item .text { font-size: 13px; color: #d4d4d4; }
    .feedback-item .ticket { font-size: 11px; color: #58a6ff; margin-top: 4px; }
    .commitment-item { padding: 10px 0; border-bottom: 1px solid #21262d; display: flex; gap: 12px; align-items: flex-start; }
    .commitment-item:last-child { border-bottom: none; }
    .commitment-status { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #30363d; flex-shrink: 0; margin-top: 2px; }
    .commitment-status.open { border-color: #d29922; }
    .commitment-status.done { background: #238636; border-color: #238636; }
    .commitment-item .text { font-size: 13px; color: #d4d4d4; }
    .commitment-item .meta { font-size: 11px; color: #8b949e; margin-top: 2px; }
    footer { border-top: 1px solid #21262d; padding: 24px; text-align: center; font-size: 12px; color: #8b949e; margin-top: 64px; }
