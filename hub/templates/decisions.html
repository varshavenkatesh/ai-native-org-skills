<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decisions — {{team_name}} Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.6; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid #21262d; padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 12px; }
    header nav { margin-left: auto; display: flex; gap: 20px; font-size: 13px; }
    header nav a { color: #8b949e; }
    header nav a:hover { color: #e6edf3; }
    .container { max-width: 860px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .page-meta { font-size: 14px; color: #8b949e; margin-bottom: 40px; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .filter-btn { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; }
    .filter-btn.active { background: #1f6feb22; border-color: #1f6feb55; color: #58a6ff; }
    .decision-entry {
      border-left: 3px solid #30363d;
      padding: 0 0 32px 20px;
      margin-bottom: 0;
      position: relative;
    }
    .decision-entry::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30363d;
      position: absolute;
      left: -5px;
      top: 6px;
    }
    .decision-entry.adr::before { background: #58a6ff; }
    .decision-entry .date { font-size: 12px; color: #8b949e; margin-bottom: 6px; }
    .decision-entry h3 { font-size: 15px; font-weight: 600; color: #e6edf3; margin-bottom: 8px; }
    .decision-entry .body { font-size: 14px; color: #8b949e; margin-bottom: 10px; }
    .decision-entry .body strong { color: #d4d4d4; }
    .decision-entry .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #161b22; border: 1px solid #30363d; color: #8b949e; }
    .tag-adr { border-color: #1f6feb55; color: #58a6ff; background: #1f6feb11; }
    .adr-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #1f6feb22; border: 1px solid #1f6feb55; color: #79c0ff; margin-left: 8px; vertical-align: middle; }
    footer { border-top: 1px solid #21262d; padding: 24px; text-align: center; font-size: 12px; color: #8b949e; margin-top: 64px; }
  </style>
</head>
<body>

<header>

  <h1>Decisions Log</h1>
  <div class="page-meta">{{team_name}} &middot; {{decision_count}} decisions logged &middot; last updated {{last_updated}}</div>

  <div class="filter-bar">
    <span class="filter-btn active">All</span>
    <span class="filter-btn">ADRs</span>
    <span class="filter-btn">Tech</span>
    <span class="filter-btn">Process</span>
